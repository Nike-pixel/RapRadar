    <body>
        <!-- Het laadscherm dat over je homepage ligt en netjes wegfade -->
<div id="page-loader">
    <div class="radar-wrapper">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <img src="../images/logo.png" alt="RapRadar" class="radar-logo">
    </div>
    <div class="status-text">Scanning the scene...</div>
</div>

<style>
    /* Het laadscherm bedekt de hele pagina met een dikke zwarte laag */
    #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0a0a0a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'Arial Black', Impact, sans-serif;
        color: #ffffff;
        /* Na 2.5 seconde wacht te hebben gestaan, fade hij in 1.2 seconde langzaam weg naar transparant */
        animation: fadeOut 1.2s cubic-bezier(0.77, 0, 0.175, 1) 2.5s forwards;
    }

    /* De Radar Container */
    .radar-wrapper {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
    }

    /* Pulserende radar-cirkels in neon-groen */
    .radar-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid #4ade80;
        border-radius: 50%;
        opacity: 0;
        animation: pulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .radar-ring:nth-child(2) {
        animation-delay: 0.6s;
    }

    /* Logo in het midden */
    .radar-logo {
        width: 110px;
        height: auto;
        z-index: 2;
        filter: drop-shadow(0 0 15px rgba(74, 222, 128, 0.4));
        animation: logo-pop 0.6s ease-out forwards;
    }

    /* Status tekst */
    .status-text {
        font-size: 13px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #888888;
        animation: blink 1.2s infinite alternate;
    }

    /* De fade-out animatie: zorgt dat het scherm geleidelijk doorzichtig wordt en daarna verdwijnt */
    @keyframes fadeOut {
        0% {
            opacity: 1;
            visibility: visible;
        }
        100% {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    }

    @keyframes pulse {
        0% { transform: scale(0.5); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes logo-pop {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes blink {
        from { opacity: 0.4; }
        to { opacity: 1; }
    }
</style>
