<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <!-- Totale tijd naar 5.5 seconden zodat het lekker rustig verloopt -->
    <meta http-equiv="refresh" content="5.5; url=Home/homepage.html">
    <title>RapRadar — Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', Impact, sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* De Radar Container */
        .radar-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 2;
        }

        /* Pulserende radar-cirkels in neon-groen */
        .radar-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #4ade80;
            border-radius: 50%;
            opacity: 0;
            animation: pulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .radar-ring:nth-child(2) {
            animation-delay: 0.6s;
        }

        /* Logo in het midden */
        .radar-logo {
            width: 110px;
            height: auto;
            z-index: 2;
            filter: drop-shadow(0 0 15px rgba(74, 222, 128, 0.4));
            animation: logo-pop 0.6s ease-out forwards;
        }

        /* Status tekst */
        .status-text {
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #888888;
            animation: blink 1.2s infinite alternate;
            z-index: 2;
        }

        /* --- DE CIRKEL NOG SLOMER GEZET --- */
        .site-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            clip-path: circle(0% at 50% 50%);
            /* Start na 2.6 seconden, maar doet er nu 2.5 seconden over om open te gaan! */
            animation: expand-site 2.5s cubic-bezier(0.77, 0, 0.175, 1) 2.6s forwards;
            pointer-events: none;
        }

        .site-reveal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.18);
        }

        @keyframes expand-site {
            0% {
                clip-path: circle(0% at 50% 50%);
            }
            100% {
                clip-path: circle(150% at 50% 50%);
            }
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0.9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes logo-pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes blink {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="radar-wrapper">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <img src="images/logo.png" alt="RapRadar" class="radar-logo">
    </div>

    <div class="status-text">Scanning the scene...</div>

    <div class="site-reveal">
        <img src="preview.jpg" alt="RapRadar Homepage">
    </div>

</body>
</html>
